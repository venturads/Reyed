<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reyed Admin</title><link rel="stylesheet" href="./styles.css?v=9"></head>
<body><div class="app-shell"><header class="topbar"><div class="brand"><div class="logo">⚙️</div><div><p class="eyebrow">Administrator</p><h1>Reyed control center</h1></div></div><button class="icon-btn" id="logoutBtn">Sign out</button></header><main>
<div class="grid two"><div class="panel"><div class="small">Total rides</div><div class="money" id="totalRides">0</div></div><div class="panel"><div class="small">Active rides</div><div class="money" id="activeRides">0</div></div></div>
<div class="panel"><h2>App settings</h2><div class="grid two"><div><label>App name</label><input id="appName"></div><div><label>Announcement</label><input id="announcement" placeholder="Optional message shown to riders"></div><div><label>External link button text</label><input id="linkLabel"></div><div><label>External link URL</label><input id="linkUrl" type="url"></div><div><label>Support phone</label><input id="supportPhone"></div><div><label>Support email</label><input id="supportEmail" type="email"></div></div><label style="display:flex;gap:10px;align-items:center;margin-top:14px"><input id="allowNewRides" type="checkbox" style="width:auto"> Allow riders to create new rides</label><button class="btn primary" id="saveSettings" style="margin-top:14px">Save app settings</button></div>
<div class="panel"><div class="meta"><h2>All rides</h2><div class="btn-row"><button class="btn secondary" id="addRideBtn">Add ride</button><button class="btn bad" id="resetBtn">Reset demo</button></div></div><div id="rideEditor"></div></div>
<div class="panel"><div class="meta"><h2>Users</h2><button class="btn secondary" id="addUserBtn">Add user</button></div><div id="userEditor"></div></div>
<div class="notice"><strong>Admin control:</strong> changes are saved to the shared Google Apps Script data store and appear on both phones after sync.</div>
</main></div><script src="./google-sync-config.js?v=9"></script><script src="./google-sync.js?v=9"></script><script src="./app.js?v=9"></script><script>
const admin=requireRole('admin'); if(admin){logoutBtn.onclick=logout; saveSettings.onclick=saveAppSettings; addRideBtn.onclick=addRide; addUserBtn.onclick=addUser; resetBtn.onclick=resetDemo; render();}
function saveAppSettings(){const db=getDB();db.settings={appName:appName.value.trim()||'Reyed',announcement:announcement.value.trim(),externalLinkLabel:linkLabel.value.trim()||'Open ride link',externalLinkUrl:linkUrl.value.trim(),supportPhone:supportPhone.value.trim(),supportEmail:supportEmail.value.trim(),allowNewRides:allowNewRides.checked};saveDB(db);toast('App settings saved.');render()}
function addRide(){const db=getDB(),riders=db.users.filter(u=>u.role==='rider');if(!riders.length){toast('Add a rider first.');return}db.rides.unshift({id:uid('ride'),riderId:riders[0].id,driverId:null,pickup:'Pickup address',destination:'Drop-off address',pickupLat:null,pickupLng:null,destLat:null,destLng:null,offer:0,status:'requested',deniedBy:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});saveDB(db);render();toast('Ride added.')}
function addUser(){const db=getDB();db.users.push({id:uid('user'),role:'rider',name:'New User',email:'new'+Date.now()+'@reyed.demo',password:'change-me',vehicle:''});saveDB(db);render();toast('User added.')}
function resetDemo(){if(!confirm('Reset every user, ride, and setting?'))return;saveDB(defaultDB());render();toast('Demo reset.')}
function updateRide(id){const db=getDB(),r=db.rides.find(x=>x.id===id);if(!r)return;const q=n=>document.querySelector(`[data-${n}="${id}"]`);r.riderId=q('rider').value;r.driverId=q('driver').value||null;r.pickup=q('pickup').value.trim();r.destination=q('destination').value.trim();r.offer=Number(q('offer').value)||0;r.status=q('status').value;r.updatedAt=new Date().toISOString();if(r.status==='completed')r.completedAt=r.completedAt||new Date().toISOString();saveDB(db);render();toast('Ride saved.')}
function deleteRide(id){if(!confirm('Delete this ride?'))return;const db=getDB();db.rides=db.rides.filter(r=>r.id!==id);saveDB(db);render();toast('Ride deleted.')}
function updateUser(id){const db=getDB(),u=db.users.find(x=>x.id===id);if(!u)return;const q=n=>document.querySelector(`[data-${n}="${id}"]`);u.name=q('name').value.trim();u.email=q('email').value.trim().toLowerCase();u.password=q('password').value;u.role=q('role').value;u.vehicle=q('vehicle').value.trim();saveDB(db);render();toast('User saved.')}
function deleteUser(id){if(id===admin.id){toast('You cannot delete the signed-in admin.');return}if(!confirm('Delete this user and cancel their active rides?'))return;const db=getDB();db.users=db.users.filter(u=>u.id!==id);db.rides.forEach(r=>{if(r.riderId===id||r.driverId===id){r.status='cancelled';r.updatedAt=new Date().toISOString();if(r.driverId===id)r.driverId=null}});saveDB(db);render();toast('User deleted.')}
window.render=function(){const db=getDB(),s=db.settings||defaultDB().settings;totalRides.textContent=db.rides.length;activeRides.textContent=db.rides.filter(r=>!['completed','cancelled'].includes(r.status)).length;appName.value=s.appName||'';announcement.value=s.announcement||'';linkLabel.value=s.externalLinkLabel||'';linkUrl.value=s.externalLinkUrl||'';supportPhone.value=s.supportPhone||'';supportEmail.value=s.supportEmail||'';allowNewRides.checked=s.allowNewRides!==false;
const riders=db.users.filter(u=>u.role==='rider'),drivers=db.users.filter(u=>u.role==='driver');rideEditor.innerHTML=db.rides.map(r=>`<article class="ride-card"><div class="meta"><strong>#${escapeHTML(r.id.slice(-7))}</strong>${statusBadge(r.status)}</div><div class="grid two"><div><label>Rider</label><select data-rider="${r.id}">${riders.map(u=>`<option value="${u.id}" ${u.id===r.riderId?'selected':''}>${escapeHTML(u.name)}</option>`).join('')}</select></div><div><label>Driver</label><select data-driver="${r.id}"><option value="">Unassigned</option>${drivers.map(u=>`<option value="${u.id}" ${u.id===r.driverId?'selected':''}>${escapeHTML(u.name)}</option>`).join('')}</select></div><div><label>Pickup</label><input data-pickup="${r.id}" value="${escapeHTML(r.pickup)}"></div><div><label>Drop-off</label><input data-destination="${r.id}" value="${escapeHTML(r.destination)}"></div><div><label>Offer / display amount</label><input type="number" step=".50" data-offer="${r.id}" value="${Number(r.offer)||0}"></div><div><label>Status</label><select data-status="${r.id}">${Object.keys(STATUS_LABELS).map(st=>`<option value="${st}" ${st===r.status?'selected':''}>${statusLabel(st)}</option>`).join('')}</select></div></div><div class="btn-row" style="margin-top:12px"><button class="btn primary" onclick="updateRide('${r.id}')">Save ride</button><button class="btn bad" onclick="deleteRide('${r.id}')">Delete</button></div></article>`).join('')||'<div class="empty">No rides.</div>';
userEditor.innerHTML=db.users.map(u=>`<article class="ride-card"><div class="grid two"><div><label>Name</label><input data-name="${u.id}" value="${escapeHTML(u.name)}"></div><div><label>Role</label><select data-role="${u.id}">${['rider','driver','admin'].map(role=>`<option ${u.role===role?'selected':''}>${role}</option>`).join('')}</select></div><div><label>Email</label><input data-email="${u.id}" value="${escapeHTML(u.email)}"></div><div><label>Password</label><input data-password="${u.id}" value="${escapeHTML(u.password)}"></div><div style="grid-column:1/-1"><label>Vehicle / notes</label><input data-vehicle="${u.id}" value="${escapeHTML(u.vehicle||'')}"></div></div><div class="btn-row" style="margin-top:12px"><button class="btn primary" onclick="updateUser('${u.id}')">Save user</button><button class="btn bad" onclick="deleteUser('${u.id}')">Delete</button></div></article>`).join('')}
</script></body></html>
