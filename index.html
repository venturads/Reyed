<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RideQuote</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><header><h1>RideQuote</h1><button id="reset">Reset</button></header><nav><button data-v="rider" class="active">Rider</button><button data-v="driver">Driver</button><button data-v="admin">Admin</button></nav><section id="rider" class="view active"><div class="card"><h2>Request a ride</h2><input id="rn" placeholder="Name"><input id="rp" placeholder="Phone"><input id="pu" placeholder="Pickup"><input id="ds" placeholder="Destination"><textarea id="nt" placeholder="Notes"></textarea><button id="post">Post request</button></div><div id="rideCard" class="card"></div><div class="card"><h2>Driver quotes</h2><div id="quotes"></div></div></section><section id="driver" class="view"><div class="card"><h2>Driver portal</h2><select id="driverSel"></select><div id="driverInfo"></div></div><div class="card"><div id="trip"></div><input id="amt" type="number" placeholder="Quote amount"><input id="eta" placeholder="Pickup time"><textarea id="msg" placeholder="Message"></textarea><button id="send">Send quote</button></div><div id="accepted" class="card"></div></section><section id="admin" class="view"><div class="card"><h2>Add driver</h2><input id="an" placeholder="Name"><input id="ap" placeholder="Phone"><input id="av" placeholder="Vehicle"><input id="al" placeholder="Plate"><input id="apay" placeholder="Payment"><button id="add">Add driver</button></div><div class="card"><h2>Drivers</h2><div id="drivers"></div></div><div class="card"><h2>History</h2><div id="history"></div></div></section></div><script src="app.js"></script></body></html>
