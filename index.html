<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reyed Login</title><link rel="stylesheet" href="./styles.css?v=9"></head>
<body><div class="login-wrap"><div class="login-card">
<div class="logo">🚘</div><p class="eyebrow">Reyed</p><h1 style="font-size:1.7rem">Sign in</h1>
<p class="small">Riders, drivers, and admins each open only their own workspace.</p>
<div style="margin-top:18px"><label for="email">Email</label><input id="email" type="email" autocomplete="username" placeholder="name@example.com"></div>
<div style="margin-top:12px"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"></div>
<button class="btn primary full" id="loginBtn" style="margin-top:16px">Sign in</button>
<div class="demo-box"><strong>Demo logins</strong><br>
Rider: rider@reyed.demo / rider123<br>Driver: driver@reyed.demo / driver123<br>Admin: admin@reyed.demo / admin123</div>
</div></div><script src="./google-sync-config.js?v=9"></script><script src="./google-sync.js?v=9"></script><script src="./app.js?v=9"></script><script>
(function(){
  getDB();
  const s=getSession(); if(s){const u=currentUser(); if(u) route(u);}
  document.getElementById("loginBtn").addEventListener("click",login);
  document.addEventListener("keydown",e=>{if(e.key==="Enter")login()});
  function login(){
    const email=document.getElementById("email").value.trim().toLowerCase();
    const password=document.getElementById("password").value;
    const user=getDB().users.find(u=>u.email.toLowerCase()===email&&u.password===password);
    if(!user){toast("Email or password is incorrect.");return}
    setSession(user);route(user);
  }
  function route(user){location.href=user.role==="rider"?"customer.html":user.role==="driver"?"rider.html":"admin.html"}
})();
</script></body></html>
