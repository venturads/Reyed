<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reyed - Driver Found</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    #map { height: 300px; width: 100%; border-radius: 12px; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Topbar -->
    <div class="topbar">
      <div>
        <p class="eyebrow">Reyed</p>
        <h1>Driver Found!</h1>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="icon-btn" onclick="goHome()">🏠</button>
      </div>
    </div>

    <main>
      <!-- Live Map -->
      <div id="map"></div>

      <!-- Driver Info -->
      <div class="panel">
        <h2 style="margin-top: 0;">Your Driver</h2>
        
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding: 15px; background: #f0fdf4; border-radius: 12px;">
          <div class="driver-avatar" style="background: #16a34a; color: white; font-size: 1.5rem;">A</div>
          <div>
            <strong style="font-size: 1.1rem;">Alex Morgan</strong>
            <p style="margin: 3px 0; color: #166534; font-size: .84rem;">⭐ 4.85 (958 rides)</p>
            <p style="margin: 3px 0; color: #166534; font-size: .84rem;">🚗 2021 Silver Honda Accord</p>
            <p style="margin: 3px 0; color: #166534; font-size: .84rem;">Plate: 7KPL443</p>
          </div>
        </div>

        <div style="padding: 15px; background: #f3f4f6; border-radius: 12px; margin-bottom: 15px;">
          <p style="margin: 0 0 8px;"><strong>📍 Pickup:</strong></p>
          <p style="margin: 0 0 12px; color: #6b7280;" id="pickupText">123 Main St, City</p>
          
          <p style="margin: 0 0 8px;"><strong>🚩 Destination:</strong></p>
          <p style="margin: 0 0 12px; color: #6b7280;" id="destText">456 Oak Ave, City</p>
          
          <p style="margin: 0 0 8px;"><strong>💰 Fare:</strong></p>
          <p style="margin: 0; color: #16a34a; font-size: 1.2rem; font-weight: bold;" id="priceText">$12.50</p>
          
          <p style="margin: 8px 0 0;"><strong>⏱️ Arriving in:</strong> <span id="etaText">5 minutes</span></p>
        </div>

        <button class="primary-btn" onclick="contactDriver()">📞 Contact Driver</button>
        <button class="secondary-btn" onclick="shareLocation()">📍 Share Location</button>
      </div>
    </main>
  </div>

  <!-- Navigation -->
  <div style="position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e5e7eb; display: flex; justify-content: center; gap: 20px; padding: 12px; max-width: 520px; margin: 0 auto; left: 50%; transform: translateX(-50%);">
    <button onclick="goToPage('customer.html')" style="border: none; background: none; font-size: 24px; cursor: pointer; opacity: 1;">👤</button>
    <button onclick="goToPage('rider.html')" style="border: none; background: none; font-size: 24px; cursor: pointer; opacity: 0.5;">🚗</button>
    <button onclick="goToPage('admin.html')" style="border: none; background: none; font-size: 24px; cursor: pointer; opacity: 0.5;">⚙️</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    let map;
    let userMarker, driverMarker;
    let userLocation = { lat: 40.7128, lng: -74.0060 };
    let driverLocation = { lat: 40.7140, lng: -74.0040 };

    function initMap() {
      map = L.map('map').setView([40.7128, -74.0060], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      userMarker = L.circleMarker([userLocation.lat, userLocation.lng], {
        radius: 8,
        fillColor: "#3b82f6",
        color: "#1e40af",
        weight: 2,
        opacity: 1,
        fillOpacity: 0.8
      }).addTo(map).bindPopup('📍 Your Location');

      driverMarker = L.circleMarker([driverLocation.lat, driverLocation.lng], {
        radius: 12,
        fillColor: "#10b981",
        color: "#047857",
        weight: 3,
        opacity: 1,
        fillOpacity: 0.8
      }).addTo(map).bindPopup('🚗 Alex (Driver)');

      L.polyline([
        [driverLocation.lat, driverLocation.lng],
        [userLocation.lat, userLocation.lng]
      ], { color: '#06b6d4', weight: 2, opacity: 0.7 }).addTo(map);

      const group = new L.featureGroup([userMarker, driverMarker]);
      map.fitBounds(group.getBounds().pad(0.1), { maxZoom: 13 });
    }

    function updateDistance() {
      const dist = calculateDistance(driverLocation, userLocation);
      const eta = Math.max(1, Math.ceil(dist * 2));
      document.getElementById('etaText').textContent = eta + ' minutes';
      
      if (dist < 0.05) {
        document.getElementById('etaText').textContent = 'Arriving now...';
      }
    }

    function calculateDistance(loc1, loc2) {
      const R = 6371;
      const dLat = (loc2.lat - loc1.lat) * Math.PI / 180;
      const dLng = (loc2.lng - loc1.lng) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(loc1.lat * Math.PI / 180) * Math.cos(loc2.lat * Math.PI / 180) *
                Math.sin(dLng/2) * Math.sin(dLng/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    window.addEventListener('load', function() {
      const rideData = JSON.parse(localStorage.getItem('rideRequest'));
      if (rideData) {
        document.getElementById('pickupText').textContent = rideData.pickup;
        document.getElementById('destText').textContent = rideData.destination;
        document.getElementById('priceText').textContent = '$' + rideData.price;
      }
      
      initMap();
      updateDistance();
      setInterval(updateDistance, 3000);
    });

    function contactDriver() {
      showToast('📞 Calling driver: (555) 903-1144');
    }

    function shareLocation() {
      showToast('📍 Location shared with driver');
    }

    function goToPage(page) {
      window.location.href = page;
    }

    function goHome() {
      window.location.href = 'index.html';
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }
  </script>
</body>
</html>
