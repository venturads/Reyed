<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reyed - Active Ride</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    #map { height: 300px; width: 100%; border-radius: 12px; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Topbar -->
    <div class="topbar">
      <div>
        <p class="eyebrow">Reyed Driver</p>
        <h1>Ride in Progress</h1>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="icon-btn" onclick="goHome()">🏠</button>
      </div>
    </div>

    <main>
      <!-- Live Map -->
      <div id="map"></div>

      <!-- Active Ride Info -->
      <div class="panel">
        <h2 style="margin-top: 0;">Passenger Onboard</h2>
        
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
          <div class="driver-avatar" style="background: #e5e7eb; color: #111;">P</div>
          <div>
            <strong>Passenger Name</strong>
            <p style="margin: 3px 0; color: #6b7280; font-size: .84rem;">Rating: ⭐ 4.8</p>
            <p style="margin: 3px 0; color: #6b7280; font-size: .84rem;">📞 (555) 123-4567</p>
          </div>
        </div>

        <div style="padding: 15px; background: #dbeafe; border-radius: 12px; margin-bottom: 15px;">
          <p style="margin: 0 0 8px;"><strong>📍 From:</strong></p>
          <p style="margin: 0 0 12px; color: #1e40af;" id="pickupText">123 Main St, City</p>
          
          <p style="margin: 0 0 8px;"><strong>🚩 To:</strong></p>
          <p style="margin: 0 0 12px; color: #1e40af;" id="destText">456 Oak Ave, City</p>
          
          <p style="margin: 0 0 8px;"><strong>💰 Fare:</strong></p>
          <p style="margin: 0; color: #0369a1; font-size: 1.2rem; font-weight: bold;" id="priceText">$12.50</p>
          
          <p style="margin: 8px 0 0;"><strong>⏱️ ETA:</strong> <span id="etaText">12 minutes</span></p>
        </div>

        <button class="primary-btn" onclick="completeRide()">Complete Ride</button>
        <button class="secondary-btn" onclick="emergencyStop()">Emergency</button>
      </div>
    </main>
  </div>

  <!-- Navigation -->
  <div style="position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e5e7eb; display: flex; justify-content: center; gap: 20px; padding: 12px; max-width: 520px; margin: 0 auto; left: 50%; transform: translateX(-50%);">
    <button onclick="goToPage('customer.html')" style="border: none; background: none; font-size: 24px; cursor: pointer; opacity: 0.5;">👤</button>
    <button onclick="goToPage('rider.html')" style="border: none; background: none; font-size: 24px; cursor: pointer; opacity: 1;">🚗</button>
    <button onclick="goToPage('admin.html')" style="border: none; background: none; font-size: 24px; cursor: pointer; opacity: 0.5;">⚙️</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    let map;
    let driverMarker, destMarker;
    let driverLocation = { lat: 40.7128, lng: -74.0060 };
    let destLocation = { lat: 40.7580, lng: -73.9855 };

    // Initialize map
    function initMap() {
      map = L.map('map').setView([40.7128, -74.0060], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // Driver marker
      driverMarker = L.circleMarker([driverLocation.lat, driverLocation.lng], {
        radius: 10,
        fillColor: "#10b981",
        color: "#047857",
        weight: 3,
        opacity: 1,
        fillOpacity: 0.8
      }).addTo(map).bindPopup('🚗 You (Driver)');

      // Destination marker
      destMarker = L.circleMarker([destLocation.lat, destLocation.lng], {
        radius: 10,
        fillColor: "#ef4444",
        color: "#991b1b",
        weight: 3,
        opacity: 1,
        fillOpacity: 0.8
      }).addTo(map).bindPopup('🚩 Destination');

      // Route line
      const polyline = L.polyline([
        [driverLocation.lat, driverLocation.lng],
        [destLocation.lat, destLocation.lng]
      ], { color: '#06b6d4', weight: 3, opacity: 0.8 }).addTo(map);

      const group = new L.featureGroup([driverMarker, destMarker]);
      map.fitBounds(group.getBounds().pad(0.1), { maxZoom: 13 });
    }

    // Simulate movement toward destination
    function simulateMovement() {
      const destLat = destLocation.lat;
      const destLng = destLocation.lng;
      const currentLat = driverLocation.lat;
      const currentLng = driverLocation.lng;
      
      driverLocation.lat = currentLat + (destLat - currentLat) * 0.02;
      driverLocation.lng = currentLng + (destLng - currentLng) * 0.02;
      
      driverMarker.setLatLng([driverLocation.lat, driverLocation.lng]);
      
      const dist = calculateDistance(driverLocation, destLocation);
      document.getElementById('etaText').textContent = Math.max(1, Math.ceil(dist * 2)) + ' min';
    }

    // Calculate distance
    function calculateDistance(loc1, loc2) {
      const R = 6371;
      const dLat = (loc2.lat - loc1.lat) * Math.PI / 180;
      const dLng = (loc2.lng - loc1.lng) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(loc1.lat * Math.PI / 180) * Math.cos(loc2.lat * Math.PI / 180) *
                Math.sin(dLng/2) * Math.sin(dLng/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    // Load ride data
    window.addEventListener('load', function() {
      const rideData = JSON.parse(localStorage.getItem('rideRequest'));
      if (rideData) {
        document.getElementById('pickupText').textContent = rideData.pickup;
        document.getElementById('destText').textContent = rideData.destination;
        document.getElementById('priceText').textContent = '$' + rideData.price;
      }
      
      initMap();
      setInterval(simulateMovement, 2000);
    });

    function completeRide() {
      if (confirm('Mark this ride as complete?')) {
        showToast('✅ Ride completed! Thank you for driving.');
        setTimeout(() => {
          window.location.href = 'driver-ride-complete.html';
        }, 2000);
      }
    }

    function emergencyStop() {
      if (confirm('Report an emergency?')) {
        showToast('🚨 Emergency services alerted');
      }
    }

    function goToPage(page) {
      window.location.href = page;
    }

    function goHome() {
      window.location.href = 'index.html';
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }
  </script>
</body>
</html>
