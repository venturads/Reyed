<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reyed Ride Tracking</title>
<link rel="stylesheet" href="./styles.css?v=8"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head>
<body><div class="app-shell"><header class="topbar"><div class="brand"><div class="logo">🗺️</div><div><p class="eyebrow">Live ride</p><h1>Ride tracking</h1></div></div><button class="icon-btn" id="backBtn">Back</button></header>
<main><div class="panel"><div id="trackingMap" class="map"></div></div><div class="panel" id="rideDetails"></div></main></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="./google-sync-config.js?v=8"></script><script src="./google-sync.js?v=8"></script><script src="./app.js?v=8"></script><script>
const user=currentUser();if(!user)location.href="index.html";
const id=new URLSearchParams(location.search).get("id");let map,layers=[];
if(user){
 document.getElementById("backBtn").addEventListener("click",()=>location.href=user.role==="rider"?"customer.html":user.role==="driver"?"rider.html":"admin.html");
 map=initLeafletMap("trackingMap");render();
}
window.render=function(){
 const r=getDB().rides.find(x=>x.id===id);
 const allowed=r&&(user.role==="admin"||r.riderId===user.id||r.driverId===user.id);
 if(!allowed){document.getElementById("rideDetails").innerHTML='<div class="empty">This ride is not available to this account.</div>';return}
 document.getElementById("rideDetails").innerHTML=rideCard(r);
 draw(r);
}
function draw(r){
 if(!map)return;layers.forEach(l=>map.removeLayer(l));layers=[];
 const points=[];
 if(r.pickupLat!=null){const p=[r.pickupLat,r.pickupLng];points.push(p);layers.push(L.marker(p).addTo(map).bindPopup("Pickup"))}
 if(r.destLat!=null){const d=[r.destLat,r.destLng];points.push(d);layers.push(L.marker(d).addTo(map).bindPopup("Drop-off"))}
 if(points.length===2){layers.push(L.polyline(points,{weight:5}).addTo(map));map.fitBounds(points,{padding:[40,40]})}
}
</script></body></html>
