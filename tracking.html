<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reyed - Tracking</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    #map{height:320px;width:100%;border-radius:24px;margin-bottom:-32px;z-index:1;box-shadow:var(--shadow)}
    .panel{z-index:2}
    .eta-badge{position:absolute;right:28px;top:92px;z-index:500;background:rgba(255,255,255,.95);padding:9px 12px;border-radius:999px;font-size:.8rem;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.15)}
    .app-shell main{position:relative}
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <div><p class="eyebrow">Reyed</p><h1>Tracking Ride</h1></div>
      <button class="icon-btn" onclick="location.href='index.html'">🏠</button>
    </div>

    <main>
      <div class="eta-badge" id="etaBadge">Locating…</div>
      <div id="map" aria-label="Live ride tracking map"></div>

      <div class="panel">
        <div id="rideInfo" style="padding:15px;background:#f3f4f6;border-radius:12px;margin-bottom:15px">
          <p><strong>📍 Pickup:</strong> <span id="pickupText">—</span></p>
          <p><strong>🚩 Destination:</strong> <span id="destText">—</span></p>
          <p><strong>💰 Fare:</strong> <span id="priceText">—</span></p>
          <p><strong>📡 Driver distance:</strong> <span id="distanceText">—</span></p>
        </div>
        <button class="primary-btn" onclick="startDriverSimulation()">Simulate Driver Approaching</button>
        <button class="secondary-btn" onclick="cancelRide()">Cancel Ride</button>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    let map;
    let pickupMarker;
    let destinationMarker;
    let driverMarker;
    let driverTimer;
    let ride;

    function initTracking() {
      ride = safeRide();
      const pickup = validCoords(ride.pickupCoords) ? ride.pickupCoords : { lat: 34.0522, lng: -118.2437 };
      const destination = validCoords(ride.destinationCoords) ? ride.destinationCoords : { lat: pickup.lat + 0.025, lng: pickup.lng + 0.03 };

      document.getElementById('pickupText').textContent = ride.pickup || 'Selected pickup';
      document.getElementById('destText').textContent = ride.destination || 'Selected destination';
      document.getElementById('priceText').textContent = `$${Number(ride.price || 0).toFixed(2)}`;

      map = L.map('map').setView(pickup, 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      pickupMarker = L.marker(pickup).addTo(map).bindPopup('Pickup');
      destinationMarker = L.marker(destination).addTo(map).bindPopup('Destination');
      L.polyline([pickup, destination], { weight: 5, opacity: 0.75 }).addTo(map);

      const bounds = L.latLngBounds([pickup, destination]);
      map.fitBounds(bounds, { padding: [40, 40] });
      setTimeout(() => map.invalidateSize(), 150);

      const driverStart = { lat: pickup.lat + 0.018, lng: pickup.lng - 0.018 };
      driverMarker = L.marker(driverStart, {
        icon: L.divIcon({ className: '', html: '<div style="font-size:32px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))">🚗</div>', iconSize: [36,36], iconAnchor: [18,18] })
      }).addTo(map).bindPopup('Driver');

      updateDistance(driverStart, pickup);
    }

    function startDriverSimulation() {
      clearInterval(driverTimer);
      const pickup = validCoords(ride.pickupCoords) ? ride.pickupCoords : { lat: 34.0522, lng: -118.2437 };
      document.getElementById('etaBadge').textContent = 'Driver approaching';

      driverTimer = setInterval(() => {
        const current = driverMarker.getLatLng();
        const next = {
          lat: current.lat + (pickup.lat - current.lat) * 0.08,
          lng: current.lng + (pickup.lng - current.lng) * 0.08
        };
        driverMarker.setLatLng(next);
        const meters = map.distance(next, pickup);
        updateDistance(next, pickup);

        if (meters < 35) {
          clearInterval(driverTimer);
          driverMarker.setLatLng(pickup).openPopup();
          document.getElementById('etaBadge').textContent = 'Driver arrived';
          document.getElementById('distanceText').textContent = 'Arrived';
          ride.status = 'driver-arrived';
          localStorage.setItem('rideRequest', JSON.stringify(ride));
        }
      }, 500);
    }

    function updateDistance(driver, pickup) {
      const meters = map.distance(driver, pickup);
      const miles = meters / 1609.344;
      document.getElementById('distanceText').textContent = miles < 0.1 ? `${Math.round(meters)} m` : `${miles.toFixed(1)} mi`;
      document.getElementById('etaBadge').textContent = `${Math.max(1, Math.ceil(miles * 3))} min away`;
    }

    function cancelRide() {
      if (!confirm('Cancel this ride request?')) return;
      clearInterval(driverTimer);
      localStorage.removeItem('rideRequest');
      location.href = 'customer.html';
    }

    function validCoords(value) {
      return value && Number.isFinite(Number(value.lat)) && Number.isFinite(Number(value.lng));
    }

    function safeRide() {
      try { return JSON.parse(localStorage.getItem('rideRequest')) || {}; }
      catch { return {}; }
    }

    window.addEventListener('load', initTracking);
  </script>
</body>
</html>
