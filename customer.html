<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reyed - Customer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <!-- Topbar -->
    <div class="topbar">
      <div>
        <p class="eyebrow">Reyed</p>
        <h1>Request Ride</h1>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="icon-btn" onclick="goHome()">🏠</button>
        <button class="icon-btn" onclick="toggleProfile()">👤</button>
      </div>
    </div>

    <main>
      <!-- Map Preview -->
      <div class="map-card">
        <div class="map-grid"></div>
        <div class="road road-one"></div>
        <div class="road road-two"></div>
        <div class="pin pickup-pin">📍</div>
        <div class="pin destination-pin">🚩</div>
        <div class="car">🚗</div>
        <div class="map-label">Your Area</div>
      </div>

      <!-- Request Card -->
      <div class="panel">
        <label>📍 Pickup Location</label>
        <div class="input-row">
          <input type="text" id="pickup" placeholder="Enter pickup address" value="123 Main St, City">
        </div>

        <label>🚩 Destination</label>
        <div class="input-row">
          <input type="text" id="destination" placeholder="Where to?" value="456 Oak Ave, City">
        </div>

        <label>Ride Type</label>
        <div class="ride-options" style="grid-template-columns: repeat(2, 1fr);">
          <button class="ride-option selected" onclick="selectRide(this, 'eco')">
            <span>🟢</span>
            <small>Eco</small>
          </button>
          <button class="ride-option" onclick="selectRide(this, 'premium')">
            <span>👑</span>
            <small>Premium</small>
          </button>
        </div>

        <div class="estimate-card">
          <div>
            <span>Estimated Price</span>
            <strong id="price">$12.50</strong>
          </div>
          <div>
            <span>Estimated Time</span>
            <strong id="time">5-8 min</strong>
          </div>
        </div>

        <button class="primary-btn" onclick="requestRide()">Request Ride Now</button>
        <button class="secondary-btn" onclick="viewScheduled()">Schedule for Later</button>
        <p class="helper">💳 Payment • 4242 ••••• 4242</p>
      </div>
    </main>
  </div>

  <!-- Navigation -->
  <div style="position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e5e7eb; display: flex; justify-content: center; gap: 20px; padding: 12px; max-width: 520px; margin: 0 auto;">
    <button onclick="goToPage('customer.html')" style="border: none; background: none; font-size: 24px; cursor: pointer; opacity: 1;">👤</button>
    <button onclick="goToPage('rider.html')" style="border: none; background: none; font-size: 24px; cursor: pointer; opacity: 0.5;">🚗</button>
    <button onclick="goToPage('admin.html')" style="border: none; background: none; font-size: 24px; cursor: pointer; opacity: 0.5;">⚙️</button>
  </div>

  <script>
    function selectRide(btn, type) {
      document.querySelectorAll('.ride-option').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      const prices = { eco: '$12.50', premium: '$28.00' };
      document.getElementById('price').textContent = prices[type];
    }

    function requestRide() {
      const pickup = document.getElementById('pickup').value;
      const destination = document.getElementById('destination').value;
      if (pickup && destination) {
        showToast('Searching for nearby drivers...');
        setTimeout(() => {
          window.location.href = 'tracking.html';
        }, 1500);
      }
    }

    function viewScheduled() {
      showToast('Schedule feature coming soon!');
    }

    function toggleProfile() {
      showToast('Profile: John Doe | 📞 (555) 123-4567');
    }

    function goToPage(page) {
      window.location.href = page;
    }

    function goHome() {
      window.location.href = 'index.html';
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }
  </script>
</body>
</html>
