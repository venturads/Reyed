<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reyed - Customer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <!-- Topbar -->
    <div class="topbar">
      <div>
        <p class="eyebrow">Reyed</p>
        <h1>Request Ride</h1>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="icon-btn" onclick="goHome()">🏠</button>
        <button class="icon-btn" onclick="toggleProfile()">👤</button>
      </div>
    </div>

    <main>
      <!-- Map Preview -->
      <div class="map-card">
        <div class="map-grid"></div>
        <div class="road road-one"></div>
        <div class="road road-two"></div>
        <div class="pin pickup-pin">📍</div>
        <div class="pin destination-pin">🚩</div>
        <div class="car">🚗</div>
        <div class="map-label">Your Area</div>
      </div>

      <!-- Request Card -->
      <div class="panel">
        <label>📍 Pickup Location</label>
        <div class="input-row">
          <input type="text" id="pickup" placeholder="Enter pickup address" value="123 Main St, City">
        </div>

        <label>🚩 Destination</label>
        <div class="input-row">
          <input type="text" id="destination" placeholder="Where to?" value="456 Oak Ave, City">
        </div>

        <label>💰 Offer Price</label>
        <div class="input-row">
          <span style="color: #6b7280; margin-right: 8px; font-weight: 600;">$</span>
          <input type="number" id="price" placeholder="Enter amount" value="12.50" min="2" step="0.25" style="border: 0; outline: 0; background: transparent; width: 100%; padding: 15px 10px; font-size: 1rem;">
        </div>

        <label>💳 Payment Method: CashApp</label>

        <label id="paymentLinkLabel">CashApp Tag</label>
        <div class="input-row">
          <span style="color: #6b7280; margin-right: 8px; font-weight: 600;">$</span>
          <input type="text" id="paymentLink" placeholder="Enter your CashApp tag (e.g., $johndoe)" value="">
        </div>

        <button class="primary-btn" onclick="requestRide()">Request Ride Now</button>
        <button class="secondary-btn" onclick="viewScheduled()">Schedule for Later</button>
      </div>
    </main>
  </div>

  <!-- Navigation -->
  <div style="position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e5e7eb; display: flex; justify-content: center; gap: 20px; padding: 12px; max-width: 520px; margin: 0 auto; left: 50%; transform: translateX(-50%);">
    <button onclick="goToPage('customer.html')" style="border: none; background: none; font-size: 24px; cursor: pointer; opacity: 1;">👤</button>
    <button onclick="goToPage('rider.html')" style="border: none; background: none; font-size: 24px; cursor: pointer; opacity: 0.5;">🚗</button>
    <button onclick="goToPage('admin.html')" style="border: none; background: none; font-size: 24px; cursor: pointer; opacity: 0.5;">⚙️</button>
  </div>

  <script>
    let selectedPayment = 'cashapp';

    function requestRide() {
      const pickup = document.getElementById('pickup').value;
      const destination = document.getElementById('destination').value;
      const price = document.getElementById('price').value;
      const paymentLink = document.getElementById('paymentLink').value;

      if (!pickup || !destination) {
        showToast('❌ Please enter pickup and destination');
        return;
      }

      if (!price || parseFloat(price) < 2) {
        showToast('❌ Minimum ride price is $2.00');
        return;
      }

      if (!paymentLink) {
        showToast('❌ Please enter your payment method details');
        return;
      }

      const rideData = {
        pickup,
        destination,
        price,
        paymentMethod: selectedPayment,
        paymentLink
      };

      localStorage.setItem('rideRequest', JSON.stringify(rideData));
      showToast('✅ Searching for nearby drivers...');
      
      setTimeout(() => {
        window.location.href = 'tracking.html';
      }, 1500);
    }

    function viewScheduled() {
      showToast('Schedule feature coming soon!');
    }

    function toggleProfile() {
      showToast('Profile: John Doe | 📞 (555) 123-4567');
    }

    function goToPage(page) {
      window.location.href = page;
    }

    function goHome() {
      window.location.href = 'index.html';
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }
  </script>
</body>
</html>
