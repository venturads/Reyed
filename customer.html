<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reyed Rider</title><link rel="stylesheet" href="./styles.css?v=8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head>
<body><div class="app-shell"><header class="topbar"><div class="brand"><div class="logo">🚘</div><div><p class="eyebrow">Rider</p><h1 id="welcome">Reyed</h1></div></div><button class="icon-btn" id="logoutBtn">Sign out</button></header>
<main>
<div class="tabs"><button class="tab active" data-view="request">Request ride</button><button class="tab" data-view="ongoing">Ongoing ride</button><button class="tab" data-view="history">Past rides</button></div>
<section id="requestView">
<div class="panel"><div id="riderMap" class="map"></div><p class="map-help">Street names come from OpenStreetMap. Tap once for pickup, then again for drop-off, or use your location.</p>
<div class="btn-row" style="margin-top:10px"><button class="btn secondary" id="locateBtn">📍 Use my location</button><button class="btn ghost" id="resetPins">Reset pins</button></div></div>
<div class="panel"><div class="grid">
<div class="autocomplete-wrap"><label for="pickup">Pickup address or business</label><input id="pickup" autocomplete="off" placeholder="Try Starbucks, hospital, or 123 Main Street"><div id="pickupStatus" class="search-status"></div><div id="pickupSuggestions" class="suggestions hidden"></div></div>
<div class="autocomplete-wrap"><label for="destination">Drop-off address or business</label><input id="destination" autocomplete="off" placeholder="Search a business, landmark, or street"><div id="destinationStatus" class="search-status"></div><div id="destinationSuggestions" class="suggestions hidden"></div></div>
<div><label for="offer">Your offer</label><input id="offer" type="number" min="2" step=".50" value="15"></div>
<button class="btn primary full" id="requestBtn">Request ride</button>
<a class="btn secondary full" style="text-decoration:none;text-align:center" href="https://www.paypal.com/" target="_blank" rel="noopener">Open payment site</a>
</div></div></section>
<section id="ongoingView" class="hidden"><div class="panel"><div class="section-heading"><div><h2>Current ride</h2><p class="small">Driver assignment and ride progress update automatically.</p></div><button class="btn ghost" id="refreshCurrent">Refresh</button></div><div id="ongoingList"></div></div></section>
<section id="historyView" class="hidden"><div class="panel"><h2>Past rides</h2><div id="historyList"></div></div></section>
</main><nav class="bottom-nav"><a class="active" href="customer.html"><span>👤</span>Rider</a></nav></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="./google-sync-config.js?v=8"></script><script src="./google-sync.js?v=8"></script><script src="./app.js?v=8"></script><script>
const user=requireRole("rider");
let map,pickupMarker,destMarker,routeLine,pickupCoord,destCoord;
if(user){
 document.getElementById("welcome").textContent=user.name;
 document.getElementById("logoutBtn").addEventListener("click",logout);
 document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>showView(btn.dataset.view)));
 map=initLeafletMap("riderMap");
 if(map) map.on("click",e=>{if(!pickupCoord)setPickup(e.latlng);else if(!destCoord)setDestination(e.latlng);else{setDestination(e.latlng)}});
 document.getElementById("locateBtn").addEventListener("click",locate);
 document.getElementById("resetPins").addEventListener("click",resetPins);
 document.getElementById("requestBtn").addEventListener("click",requestRide);
 document.getElementById("refreshCurrent").addEventListener("click",()=>{render();toast("Current ride refreshed.")});
 setupAutocomplete("pickup", setPickup);
 setupAutocomplete("destination", setDestination);
 document.addEventListener("click",e=>{if(!e.target.closest(".autocomplete-wrap"))document.querySelectorAll(".suggestions").forEach(x=>x.classList.add("hidden"))});
 render();
}
function showView(view){
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
 ["request","ongoing","history"].forEach(v=>document.getElementById(v+"View").classList.toggle("hidden",v!==view));
 if(view==="request"&&map)setTimeout(()=>map.invalidateSize(),80);
 render();
}
function setPickup(latlng){
 pickupCoord={lat:latlng.lat,lng:latlng.lng};
 if(pickupMarker)pickupMarker.setLatLng(latlng);else pickupMarker=L.marker(latlng).addTo(map).bindPopup("Pickup");
 pickupMarker.openPopup();drawLine();
 reverseGeocode(latlng).then(name=>{document.getElementById("pickup").value=name||`${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`});
}
function setDestination(latlng){
 destCoord={lat:latlng.lat,lng:latlng.lng};
 if(destMarker)destMarker.setLatLng(latlng);else destMarker=L.marker(latlng).addTo(map).bindPopup("Drop-off");
 destMarker.openPopup();drawLine();
 reverseGeocode(latlng).then(name=>{document.getElementById("destination").value=name||`${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`});
}
function drawLine(){
 if(routeLine)map.removeLayer(routeLine);
 if(pickupCoord&&destCoord){routeLine=L.polyline([[pickupCoord.lat,pickupCoord.lng],[destCoord.lat,destCoord.lng]],{weight:5}).addTo(map);map.fitBounds(routeLine.getBounds(),{padding:[35,35]});}
}
function resetPins(){
 [pickupMarker,destMarker,routeLine].forEach(x=>{if(x&&map)map.removeLayer(x)});
 pickupMarker=destMarker=routeLine=null;pickupCoord=destCoord=null;
 document.getElementById("pickup").value="";document.getElementById("destination").value="";
}
function locate(){
 if(!navigator.geolocation){toast("Location is not supported.");return}
 navigator.geolocation.getCurrentPosition(pos=>{const ll={lat:pos.coords.latitude,lng:pos.coords.longitude};setPickup(ll);map.setView(ll,16)},()=>toast("Location permission was not available."),{enableHighAccuracy:true,timeout:10000});
}

let searchTimers={};
function setupAutocomplete(inputId,setter){
 const input=document.getElementById(inputId),box=document.getElementById(inputId+"Suggestions"),status=document.getElementById(inputId+"Status");
 input.addEventListener("input",()=>{
   clearTimeout(searchTimers[inputId]);const q=input.value.trim();
   if(q.length<3){box.classList.add("hidden");box.innerHTML="";status.textContent=q?"Type at least 3 characters.":"";return}
   status.textContent="Searching nearby addresses and businesses…";
   searchTimers[inputId]=setTimeout(async()=>{
     try{
       const center=map?.getCenter();const viewbox=center?`&viewbox=${center.lng-0.35},${center.lat+0.25},${center.lng+0.35},${center.lat-0.25}&bounded=0`:"";
       const url=`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&countrycodes=us&q=${encodeURIComponent(q)}${viewbox}`;
       const res=await fetch(url,{headers:{"Accept":"application/json"}});
       if(!res.ok)throw new Error("search failed");
       const results=await res.json();
       status.textContent=results.length?`${results.length} nearby option${results.length===1?"":"s"}`:"No nearby matches found.";
       box.innerHTML=results.map((item,i)=>`<button type="button" class="suggestion" data-i="${i}"><strong>${escapeHTML(item.name||item.display_name.split(",")[0])}</strong><span>${escapeHTML(item.display_name)}</span></button>`).join("");
       box.classList.toggle("hidden",!results.length);
       box.querySelectorAll(".suggestion").forEach(btn=>btn.addEventListener("click",()=>{
         const item=results[Number(btn.dataset.i)],ll={lat:Number(item.lat),lng:Number(item.lon)};
         input.value=item.display_name;setter(ll);map.setView(ll,16);box.classList.add("hidden");status.textContent="";
       }));
     }catch(e){status.textContent="Address search is temporarily unavailable.";box.classList.add("hidden")}
   },450);
 });
}
async function geocodeOne(query){
 try{
   const center=map?.getCenter();const viewbox=center?`&viewbox=${center.lng-0.5},${center.lat+0.35},${center.lng+0.5},${center.lat-0.35}&bounded=0`:"";
   const res=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=us&q=${encodeURIComponent(query)}${viewbox}`,{headers:{"Accept":"application/json"}});
   const items=await res.json();return items[0]?{lat:Number(items[0].lat),lng:Number(items[0].lon)}:null;
 }catch(e){return null}
}
async function reverseGeocode(latlng){
 try{
   const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&lat=${latlng.lat}&lon=${latlng.lng}`;
   const res=await fetch(url,{headers:{"Accept":"application/json"}});if(!res.ok)return "";
   const item=await res.json();return item.display_name||"";
 }catch(e){return ""}
}

async function requestRide(){
 const pickup=document.getElementById("pickup").value.trim(),destination=document.getElementById("destination").value.trim(),offer=Number(document.getElementById("offer").value);
 if(!pickup||!destination){toast("Add pickup and drop-off.");return}
 if(!offer||offer<2){toast("Offer must be at least $2.00.");return}
 const active=getDB().rides.find(r=>r.riderId===user.id&&!["completed","cancelled"].includes(r.status));
 if(active){toast("You already have an ongoing ride.");showView("ongoing");return}
 document.getElementById("requestBtn").disabled=true;
 try{
   if(!pickupCoord)pickupCoord=await geocodeOne(pickup);
   if(!destCoord)destCoord=await geocodeOne(destination);
   const db=getDB();db.rides.push({id:uid("ride"),riderId:user.id,driverId:null,pickup,destination,
   pickupLat:pickupCoord?.lat??null,pickupLng:pickupCoord?.lng??null,destLat:destCoord?.lat??null,destLng:destCoord?.lng??null,
   offer,status:"requested",deniedBy:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
   saveDB(db);toast("Ride requested and sent to available drivers.");showView("ongoing");
 }finally{document.getElementById("requestBtn").disabled=false}
}
window.render=function(){
 const rides=getDB().rides.filter(r=>r.riderId===user.id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
 const ongoing=rides.filter(r=>!["completed","cancelled"].includes(r.status));
 const past=rides.filter(r=>["completed","cancelled"].includes(r.status));
 document.getElementById("ongoingList").innerHTML=ongoing.length?ongoing.map(r=>rideCard(r,{actions:r.status==="requested"?()=>`<button class="btn bad" data-cancel="${r.id}">Cancel request</button><a class="btn secondary" href="tracking.html?id=${encodeURIComponent(r.id)}">View tracking</a>`:()=>`<a class="btn primary" href="tracking.html?id=${encodeURIComponent(r.id)}">View live ride</a>`})).join(""):'<div class="empty">No ongoing ride.</div>';
 document.getElementById("historyList").innerHTML=past.length?past.map(r=>rideCard(r)).join(""):'<div class="empty">No past rides yet.</div>';
 document.querySelectorAll("[data-cancel]").forEach(b=>b.addEventListener("click",()=>cancelRide(b.dataset.cancel)));
}
function cancelRide(id){const db=getDB(),r=db.rides.find(x=>x.id===id&&x.riderId===user.id);if(r&&r.status==="requested"){r.status="cancelled";r.updatedAt=new Date().toISOString();saveDB(db);render();toast("Ride cancelled.")}}
</script></body></html>
