<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reyed - Ride Complete</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <!-- Topbar -->
    <div class="topbar">
      <div>
        <p class="eyebrow">Reyed Driver</p>
        <h1>Ride Completed</h1>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="icon-btn" onclick="goHome()">🏠</button>
      </div>
    </div>

    <main>
      <!-- Completion Card -->
      <div class="panel">
        <div style="text-align: center; padding: 30px 20px;">
          <div style="font-size: 64px; margin-bottom: 15px;">✅</div>
          <h2 style="margin: 0 0 20px;">Ride Completed!</h2>
          
          <div style="padding: 20px; background: #f0fdf4; border-radius: 12px; border-left: 4px solid #16a34a; margin-bottom: 20px;">
            <p style="margin: 0 0 8px; color: #166534;"><strong>Earnings for this ride</strong></p>
            <p style="margin: 0; font-size: 2rem; color: #16a34a; font-weight: bold;" id="earningsText">$12.50</p>
          </div>

          <div style="padding: 15px; background: #f3f4f6; border-radius: 12px; margin-bottom: 20px;">
            <p style="margin: 0 0 12px;"><strong>Ride Summary</strong></p>
            <p style="margin: 3px 0; color: #6b7280;"><strong>Distance:</strong> 3.2 km</p>
            <p style="margin: 3px 0; color: #6b7280;"><strong>Duration:</strong> 12 minutes</p>
            <p style="margin: 3px 0; color: #6b7280;"><strong>Passenger Rating:</strong> ⭐ 4.8</p>
          </div>

          <div style="padding: 15px; background: #fef3c7; border-radius: 12px; margin-bottom: 20px;">
            <p style="margin: 0; color: #92400e;">💬 <strong>Rate this passenger (optional)</strong></p>
          </div>

          <div style="display: flex; gap: 8px; margin-bottom: 20px; justify-content: center;">
            <button style="padding: 8px 12px; background: #f3f4f6; border: none; border-radius: 8px; cursor: pointer; font-size: 1.2rem;" onclick="ratePassenger(1)">⭐</button>
            <button style="padding: 8px 12px; background: #f3f4f6; border: none; border-radius: 8px; cursor: pointer; font-size: 1.2rem;" onclick="ratePassenger(2)">⭐</button>
            <button style="padding: 8px 12px; background: #f3f4f6; border: none; border-radius: 8px; cursor: pointer; font-size: 1.2rem;" onclick="ratePassenger(3)">⭐</button>
            <button style="padding: 8px 12px; background: #f3f4f6; border: none; border-radius: 8px; cursor: pointer; font-size: 1.2rem;" onclick="ratePassenger(4)">⭐</button>
            <button style="padding: 8px 12px; background: #f3f4f6; border: none; border-radius: 8px; cursor: pointer; font-size: 1.2rem;" onclick="ratePassenger(5)">⭐</button>
          </div>
        </div>

        <button class="primary-btn" onclick="acceptNewRide()">Accept New Ride</button>
        <button class="secondary-btn" onclick="backToDashboard()">Back to Dashboard</button>
      </div>
    </main>
  </div>

  <!-- Navigation -->
  <div style="position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e5e7eb; display: flex; justify-content: center; gap: 20px; padding: 12px; max-width: 520px; margin: 0 auto; left: 50%; transform: translateX(-50%);">
    <button onclick="goToPage('customer.html')" style="border: none; background: none; font-size: 24px; cursor: pointer; opacity: 0.5;">👤</button>
    <button onclick="goToPage('rider.html')" style="border: none; background: none; font-size: 24px; cursor: pointer; opacity: 1;">🚗</button>
    <button onclick="goToPage('admin.html')" style="border: none; background: none; font-size: 24px; cursor: pointer; opacity: 0.5;">⚙️</button>
  </div>

  <script>
    // Load ride data from localStorage
    window.addEventListener('load', function() {
      const rideData = JSON.parse(localStorage.getItem('rideRequest'));
      if (rideData) {
        document.getElementById('earningsText').textContent = '$' + rideData.price;
      }
    });

    function ratePassenger(rating) {
      showToast('⭐ Rating submitted: ' + rating + ' stars');
    }

    function acceptNewRide() {
      showToast('🔍 Finding new rides...');
      setTimeout(() => {
        window.location.href = 'rider.html';
      }, 1500);
    }

    function backToDashboard() {
      window.location.href = 'rider.html';
    }

    function goToPage(page) {
      window.location.href = page;
    }

    function goHome() {
      window.location.href = 'index.html';
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }
  </script>
</body>
</html>
