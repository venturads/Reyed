<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reyed Driver</title>
<link rel="stylesheet" href="./styles.css?v=9"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head>
<body><div class="app-shell"><header class="topbar"><div class="brand"><div class="logo">🚙</div><div><p class="eyebrow">Driver</p><h1 id="welcome">Driver dashboard</h1></div></div><button class="icon-btn" id="logoutBtn">Sign out</button></header>
<main><div class="tabs"><button class="tab active" data-view="available">Available rides</button><button class="tab" data-view="active">Active ride</button><button class="tab" data-view="history">History</button></div>
<section id="availableView"><div class="panel"><div class="section-heading"><div><h2>Available rides</h2><p class="small">Choose a request, review its map and details, then accept or deny it.</p></div><button class="btn ghost" id="refreshRides">Refresh</button></div><div class="available-map-wrap"><div id="availableMap" class="map small"></div><div class="map-legend"><span><i class="map-dot pickup"></i>Pickup</span><span><i class="map-dot dropoff"></i>Drop-off</span></div></div><div id="availableList"></div></div></section>
<section id="activeView" class="hidden"><div class="panel"><div id="driverMap" class="map small"></div><div id="activeList"></div></div></section>
<section id="historyView" class="hidden"><div class="panel"><h2>Completed rides</h2><div id="historyList"></div></div></section>
</main><nav class="bottom-nav"><a class="active" href="rider.html"><span>🚙</span>Driver</a></nav></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="./google-sync-config.js?v=9"></script><script src="./google-sync.js?v=9"></script><script src="./app.js?v=9"></script><script>
const user=requireRole("driver");let map,availableMap,layers=[],availableLayers=[],selectedRideId=null,driverCoord=null;
if(user){
 document.getElementById("welcome").textContent=user.name;
 document.getElementById("logoutBtn").addEventListener("click",logout);
 document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>showView(btn.dataset.view)));
 map=initLeafletMap("driverMap");
 availableMap=initLeafletMap("availableMap");
 locateDriver();
 document.getElementById("refreshRides").addEventListener("click",()=>{render();toast("Ride list refreshed.")});
 render();
}
function showView(view){
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
 ["available","active","history"].forEach(v=>document.getElementById(v+"View").classList.toggle("hidden",v!==view));
 if(view==="active"&&map)setTimeout(()=>map.invalidateSize(),80);
 if(view==="available"&&availableMap)setTimeout(()=>availableMap.invalidateSize(),80);
 render();
}
function driverActions(r){
 if(r.status==="requested")return `<button class="btn primary" data-action="accept" data-id="${r.id}">Accept</button><button class="btn bad" data-action="deny" data-id="${r.id}">Deny</button>`;
 if(r.status==="accepted")return `<button class="btn primary" data-action="arrive" data-id="${r.id}">Arrived at pickup</button>`;
 if(r.status==="arrived")return `<button class="btn primary" data-action="pickup" data-id="${r.id}">Pick up rider</button>`;
 if(r.status==="picked_up")return `<button class="btn good" data-action="dropoff" data-id="${r.id}">Drop off & complete</button>`;
 return "";
}
window.render=function(){
 const db=getDB();
 const available=db.rides.filter(r=>r.status==="requested"&&!r.driverId&&!(r.deniedBy||[]).includes(user.id)).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
 const active=db.rides.filter(r=>r.driverId===user.id&&!["completed","cancelled"].includes(r.status));
 const past=db.rides.filter(r=>r.driverId===user.id&&r.status==="completed").sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
 document.getElementById("availableList").innerHTML=available.length?available.map(r=>{
   const distance=driverCoord&&r.pickupLat!=null?haversineMiles(driverCoord,{lat:r.pickupLat,lng:r.pickupLng}):null;
   return `<div data-request-card="${r.id}" class="${selectedRideId===r.id?"selected-request":""}">${rideCard(r,{actions:ride=>`<button class="btn ghost" data-preview="${ride.id}">Show on map</button>${driverActions(ride)}${distance!=null?`<span class="driver-distance">${distance.toFixed(1)} mi from you</span>`:""}`})}</div>`;
 }).join(""):'<div class="empty">No open requests right now. Create a ride from a rider account, then return here.</div>';
 document.getElementById("activeList").innerHTML=active.length?active.map(r=>rideCard(r,{actions:driverActions})).join(""):'<div class="empty">No active ride.</div>';
 document.getElementById("historyList").innerHTML=past.length?past.map(r=>rideCard(r)).join(""):'<div class="empty">No completed rides.</div>';
 document.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>advance(b.dataset.id,b.dataset.action)));
 document.querySelectorAll("[data-preview]").forEach(b=>b.addEventListener("click",()=>{selectedRideId=b.dataset.preview;render();drawAvailableMap(available.find(r=>r.id===selectedRideId));}));
 drawMap(active[0]);
 drawAvailableMap(available.find(r=>r.id===selectedRideId)||available[0]);
}
function advance(id,action){
 const db=getDB(),r=db.rides.find(x=>x.id===id);if(!r)return;
 const ownedActive=db.rides.find(x=>x.driverId===user.id&&!["completed","cancelled"].includes(x.status)&&x.id!==id);
 if(action==="deny"){
   r.deniedBy=Array.isArray(r.deniedBy)?r.deniedBy:[];
   if(!r.deniedBy.includes(user.id))r.deniedBy.push(user.id);
   r.updatedAt=new Date().toISOString();saveDB(db);selectedRideId=null;render();toast("Ride removed from your available list.");return;
 }
 if(action==="accept"){if(ownedActive){toast("Complete your current ride first.");return}if(r.status!=="requested"||r.driverId){toast("Another driver accepted this ride.");render();return}r.driverId=user.id;r.status="accepted";}
 else if(r.driverId!==user.id){toast("This ride is not assigned to you.");return}
 else if(action==="arrive"&&r.status==="accepted")r.status="arrived";
 else if(action==="pickup"&&r.status==="arrived")r.status="picked_up";
 else if(action==="dropoff"&&r.status==="picked_up"){r.status="completed";r.completedAt=new Date().toISOString();}
 else{toast("That step is not available yet.");return}
 r.updatedAt=new Date().toISOString();saveDB(db);render();showView(r.status==="completed"?"history":"active");toast(statusLabel(r.status));
}
function drawMap(r){
 if(!map)return;layers.forEach(l=>map.removeLayer(l));layers=[];
 if(!r||r.pickupLat==null||r.destLat==null)return;
 const p=[r.pickupLat,r.pickupLng],d=[r.destLat,r.destLng];
 layers.push(L.marker(p).addTo(map).bindPopup("Pickup"),L.marker(d).addTo(map).bindPopup("Drop-off"),L.polyline([p,d],{weight:5}).addTo(map));
 map.fitBounds(L.latLngBounds([p,d]),{padding:[35,35]});
}
function locateDriver(){
 if(!navigator.geolocation)return;
 navigator.geolocation.getCurrentPosition(pos=>{driverCoord={lat:pos.coords.latitude,lng:pos.coords.longitude};render()},()=>{}, {enableHighAccuracy:true,timeout:8000});
}
function drawAvailableMap(r){
 if(!availableMap)return;availableLayers.forEach(l=>availableMap.removeLayer(l));availableLayers=[];
 if(!r||r.pickupLat==null||r.destLat==null)return;
 selectedRideId=r.id;
 const p=[r.pickupLat,r.pickupLng],d=[r.destLat,r.destLng];
 const pickupIcon=L.divIcon({className:"",html:'<div style="background:#1268e8;color:white;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid white;box-shadow:0 2px 8px #0004"><span style="transform:rotate(45deg)">P</span></div>',iconSize:[30,30],iconAnchor:[15,30]});
 const dropIcon=L.divIcon({className:"",html:'<div style="background:#14804a;color:white;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid white;box-shadow:0 2px 8px #0004"><span style="transform:rotate(45deg)">D</span></div>',iconSize:[30,30],iconAnchor:[15,30]});
 availableLayers.push(L.marker(p,{icon:pickupIcon}).addTo(availableMap).bindPopup(`<strong>Pickup</strong><br>${escapeHTML(r.pickup)}`),
 L.marker(d,{icon:dropIcon}).addTo(availableMap).bindPopup(`<strong>Drop-off</strong><br>${escapeHTML(r.destination)}`),
 L.polyline([p,d],{weight:5}).addTo(availableMap));
 if(driverCoord){availableLayers.push(L.circleMarker([driverCoord.lat,driverCoord.lng],{radius:8,weight:3,fillOpacity:1}).addTo(availableMap).bindPopup("Your location"))}
 const bounds=[p,d];if(driverCoord)bounds.push([driverCoord.lat,driverCoord.lng]);availableMap.fitBounds(bounds,{padding:[35,35]});
}

</script></body></html>
